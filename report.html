<main><article class="report" id="report"><p class="loading">Loading the report…</p></article></main>
<footer class="site-foot">Text of the King James Version is public domain. Notes, threads, reflections and the report are © 2026 Herein Is Love contributors, <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.</footer>
<script src="vendor/marked.umd.js"></script>
<script src="assets/listen.js"></script>
<script>
(async function () {
  const el = document.getElementById('report');
  try {
    const r = await fetch('content/report.md');
    if (!r.ok) throw new Error(r.status);
    const src = await r.text();
    el.innerHTML = marked.parse(src);
    // byline under the title
    const h1 = el.querySelector('h1'), by = h1 && h1.nextElementSibling;
    if (by && by.tagName === 'P' && by.textContent.length < 40) by.className = 'byline';
    // heading anchors and a contents list
    const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const h2s = [...el.querySelectorAll('h2')];
    h2s.forEach(h => h.id = slug(h.textContent));
    el.querySelectorAll('h3').forEach(h => h.id = slug(h.textContent));
    const list = document.createElement('ul'); list.className = 'toc-list';
    list.innerHTML = h2s.map(h => `<li><a href="#${h.id}">${h.textContent.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</a></li>`).join('');
    (by && by.className === 'byline' ? by : h1).after(list);
    Listen.setup({ collect: () => Listen.collectArticle(el) });
    Listen.button(list, 'beforebegin');
    el.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.appendChild(t); });
    if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  } catch (e) {
    el.innerHTML = '<p class="loading">The report could not be loaded. Serve this folder (for example with GitHub Pages) rather than opening the file directly.</p>';
  }
})();
</script>
</body>
</html>
