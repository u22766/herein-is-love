# Study threads: one idea followed through the sections where it appears.
# stops: section ids, in the order the thread visits them.
- id: union
  name: 'The union: the plan before the beginning'
  intro: The Bible's goal is God dwelling with his people, pictured as a marriage. The Father loved the
    Son before the world, chose a people in him, and planned to live with them. The promise is the rescue
    that guarantees this union. The lineage is the road the promise travels, and love is the reason for
    all of it.
  stops: [1, 1a, 2, 3, 45, 188, 229, 203, 280, 302, 399, 407, 447, 456]
- id: promise
  name: The promise grows stronger
  intro: 'Each stage of God''s relationship with Abraham raises the guarantee: a word, then a covenant
    God walks alone, then a sign and a named son, then a sworn oath.'
  stops: [8, 11, 13, 232, 15, 18, 452, 418, 428]
- id: lamb
  name: Where is the lamb?
  intro: Isaac asks the question on Moriah. God provides a ram that day, and the lamb stays unanswered
    until John the Baptist points at Jesus.
  stops: [18, 41, 68, 203, 297, 301, 449, 456]
- id: moriah
  name: 'Moriah: the pattern shown in advance'
  intro: The only beloved son, the third day, the wood carried by the son, the substitute, the mountain,
    the blessing to all nations, all in one scene.
  stops: [16, 18, 149, 283, 295, 350, 392, 407, 442, 426, 362]
- id: line
  name: The chosen line narrows to one
  intro: Chosen means carrying a promise, not ranking above others. The choice narrows from a nation to
    a tribe to a house to one man, with outsiders woven in along the way, then opens to everyone joined
    to him.
  stops: [11, 17, 20, 30, 34, 82, 100, 109, 123, 141, 195, 281, 428, 449]
- id: faith
  name: Children of Abraham by faith
  intro: Abraham was counted righteous by believing, before any sign or law. His true children share that
    faith; birth into the line alone was never enough.
  stops: [91, 13, 63, 229, 294, 362, 373, 386, 442, 428]
- id: gap
  name: Why two comings, and the gap between
  intro: 'The first coming is the rescue, the second the verdict. The gap is the open door: time for the
    house to fill, for every nation to hear, and for God to live in people.'
  stops: [6, 203, 306, 187, 396, 373, 401, 417, 429, 449, 451, 452, 456]
- id: grace
  name: Grace offered to all, received by faith
  intro: The payment covers the whole world; the blood still goes on the door and the bitten still look.
    Rescue comes first, and a changed life follows as the response, not the price.
  stops: [41, 45, 68, 301, 378, 407, 442, 447, 393]
- id: israel
  name: Israel still beloved
  intro: 'The New Testament neither gives a separate path nor writes Israel off: partial blindness, an
    irrevocable calling, a future recognition.'
  stops: [268, 394, 407, 418, 442, 456]
- id: presence
  name: With God to with men
  intro: The Bible opens with the Word "with God" and closes with God's tabernacle "with men." In between,
    God's presence moves in, leaves, and returns in a new form.
  stops: [1, 48, 229, 245, 280, 401, 437, 456]
- id: written
  name: Who wrote it, and when
  intro: Where the writing itself happened on the timeline, checked against each writer's age and background
    as the text gives them. Books of prophets and letters are read where they were written; histories
    were finished later, and their own wording shows when. Where a book records its author's death or
    says "thus far," another hand finished it.
  stops: [45, 75, 80, 81, 28, 91, 105, 106, 113, 93, 100, 134, 142, 114, 146, 158, 191, 189, 199, 208,
    218, 220, 227, 228, 248, 219, 251, 258, 250, 270, 272, 277, 278, 269, 314, 279, 410, 420, 425, 428,
    430, 445, 446, 447, 449, 450, 451, 413, 429, 452, 453, 455, 456, 10]
- id: clock
  name: The Bible’s own clock
  intro: 'Every date before the kings is computed from numbers the text gives: ages at a birth, years
    in Egypt, years to the temple. Later, seventy years and seventy weeks are counted in advance. The
    book keeps its own time.'
  stops: [5, 6, 11, 13, 17, 20, 29, 33, 41, 89, 98, 103, 149, 218, 247, 254, 270, 272, 294, 300]
- id: settime
  name: The set time
  intro: Isaac is born “at the set time of which God had spoken.” From there the text keeps a vocabulary
    of appointed time, and John counts down the hour. “When the fulness of the time was come.”
  stops: [15, 17, 217, 299, 303, 358, 391, 401, 415, 428, 431, 442, 452]
- id: waiting
  name: Forcing the time, or waiting for it
  intro: 'Hagar, the stolen blessing, the golden calf, Saul’s offering, Satan’s kingdoms, the brothers’
    urging: each is a shortcut taken because God’s timing felt slow. David, refusing to kill Saul, is
    the counter-example.'
  stops: [14, 22, 47, 107, 113, 296, 358]
- id: seed
  name: The seed under attack
  intro: From Pharaoh’s order against the sons to Herod’s at Bethlehem, the promised line is repeatedly
    cut down to one child. Revelation 12 draws it as a dragon waiting at a birth.
  stops: [36, 177, 180, 269, 291, 456]
- id: passover
  name: Passover, the timeline’s heartbeat
  intro: Every renewal on the timeline is marked by a Passover, and the text says so each time. The lamb’s
    bone is not broken from Exodus 12 to John 19.
  stops: [41, 53, 84, 198, 210, 267, 300, 339, 388, 407, 437]
- id: bride
  name: The Lamb and the bride
  intro: 'Two threads meet in one phrase: "the bride, the Lamb''s wife" (Revelation 21:9). The order never
    changes: the lamb first, then the bride. Isaac is on the altar before Rebekah comes, and Passover
    comes before Sinai. At the cross his side is opened before the church is formed, and the slain Lamb
    appears before the wedding.'
  stops: [2, 18, 19, 24, 37, 41, 45, 100, 188, 229, 203, 299, 302, 304, 399, 407, 440, 447, 456]
- id: adam
  name: The first Adam and the last Adam
  intro: Paul calls Jesus "the last Adam" (1 Corinthians 15:45). Adam heads the human family and lost
    Eden. The last Adam heads a new one and wins back more than Eden. The first received breath, and the
    last gives the Spirit.
  stops: [2, 3, 5, 281, 296, 407, 412, 437, 442]
- id: tree
  name: The tree of life
  intro: The tree of life was never forbidden. After the fall it was guarded, as a mercy, and the same
    cherubim were later woven into the temple veil. The veil tore when Jesus died, and the tree stands
    again in the city, with leaves for the healing of the nations.
  stops: [2, 3, 46, 147, 247, 407, 452, 456]
- id: death
  name: Death, and life restored
  intro: 'Death came through sin, and lifespans shrink across the timeline. God sets the limits of each
    life, yet prayer and conduct matter within them. Redemption comes in two stages: the inner person
    now, the body at the resurrection, and then death itself is destroyed.'
  stops: [3, 5, 6, 10, 75, 158, 200, 393, 409, 437, 440, 442, 456]
- id: baptism
  name: Through the water
  intro: 'Baptism is the sign of the union: buried and raised with Christ, and the bride washed. The Bible
    rehearses it in advance with Noah through the flood and Israel through the sea. Every baptism the
    text describes follows belief.'
  stops: [6, 42, 229, 294, 295, 417, 421, 423, 428, 436, 442, 447, 449]
- id: trinity
  name: The Father, the Son, and the Spirit
  intro: 'John 1:1 holds both halves: the Word was "with God" and "was God." The Son''s prayers, his not
    knowing the day, and the forsaken cry belong to the "with God" side, lived in the flesh. All three
    act at the Son''s baptism and at the cross (Hebrews 9:14).'
  stops: [1, 1a, 2, 295, 396, 401, 402, 407, 417, 452, 456]
