- section: 1a
  text: 'Job 38:7: the angels ("sons of God") were present and shouting for joy when the earth''s foundations
    were laid. The Bible never dates their rebellion, so it is not placed here. It is read where the text
    mentions it (Jude 6; 2 Peter 2:4). Ezekiel 28:13–15, if it points past the king of Tyre, puts iniquity
    found "in Eden," after creation.'
