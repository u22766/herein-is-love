- section: 3
  text: 'Outside the canon: Wisdom of Solomon 2:24 (in the Catholic and Orthodox Old Testaments) says
    "through envy of the devil came death into the world." It is the earliest text to plainly name the
    serpent as the devil and give a motive. Within this Bible, the link is first stated in Revelation
    12:9, "that old serpent, called the Devil."'
