- section: 6
  text: 'Outside the canon: 1 Enoch 6–16 expands Genesis 6:1–4. Two hundred angels (the Watchers) come
    down "in the days of Jared," take wives, father giants, and are bound until judgment. Jude 14–15 quotes
    1 Enoch 1:9, and Jude 6 and 2 Peter 2:4 match its account of bound angels. Where it cuts against this
    Bible: it blames the spread of sin largely on the Watchers (Romans 5:12 says "by one man"), and it
    uses a 364-day calendar that does not fit Leviticus.'
