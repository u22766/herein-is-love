- section: 1a
  text: 'Honest note: whether the wisdom of Proverbs 8 is Christ is debated. It sits here as possible,
    not stated. Revelation 13:8 can also be read as names "written from the foundation of the world";
    1 Peter 1:20 makes the same point about the Lamb either way.'
