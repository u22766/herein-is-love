- section: 1
  text: Micah says the ruler from Bethlehem has goings forth "from everlasting," and Peter says the Lamb
    was "foreordained before the foundation of the world." Both point back here. Stated.
  go: [195, 449]
- section: 1
  text: The verses about what God planned before creation are gathered in the next section, 1a.
  go: [1a]
- section: 1a
  text: 'The order here: the Father and the Son in love and glory; the Son before all things and the maker
    of all things; the counsel and the choosing; the promise made before any human existed; the Lamb foreordained;
    the kingdom prepared; why God created; the plan already accounting for the fall; and the angels watching
    the earth''s foundations laid. Then Genesis 1:1.'
  go: [1, 2]
- section: 1a
  text: 'Titus 1:2: eternal life was "promised before the world began," when no human existed yet to receive
    a promise. (my reading, reasonable) The promise was made within God, Father to Son.'
  go: []
- section: 1a
  text: 'Romans 8:20 and Acts 4:27–28 are here because they show the plan already accounts for the fall
    and for the cross: "subjected… in hope," and "thy counsel determined before to be done." The people
    who sinned are still held responsible (Genesis 3; Acts 2:23). The Bible gives the what, not the how.'
