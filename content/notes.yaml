  text: The first bride is taken from Adam's opened side, and they become "one flesh." Paul says this
    is "a great mystery… concerning Christ and the church" (Ephesians 5:32). Stated. The tree of life
    stands in the midst of the garden and is never forbidden; only the tree of knowledge is.
