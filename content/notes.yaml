# Study notes. Each note appears in a box above the text of its section.
# Commentary, not Scripture. Conventions: "Stated" = the Bible itself draws the link;
# "Pattern" = the text sets the pieces side by side; "(my reading)" = interpretation;
# "Honest note" = a hard text; "Outside" = material from outside the canon or text.
# go: sections to link to.
- section: 1
  text: 'The first bookend: the Word was "with God." The last: "the tabernacle of God is with men" (Revelation
    21:3). The whole book covers the distance between the two.'
