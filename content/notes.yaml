    oath of Moriah, sworn for later heirs.'
  go: [18]
- section: 452
  text: '"Once offered… the second time." And the faithful of old "without us should not be made perfect":
    past and future saints finish together.'
  go: [306, 456]
- section: 452
  text: 'Hebrews names no author. It speaks of "priests that offer gifts according to the law" (8:4) in
    the present tense: the temple service is still running, so it was written before AD 70.'
  go: []
- section: 453
  text: '"Jude… brother of James": another brother of Jesus writes.'
  go: [429]
- section: 454
  text: 'Daniel 9:26 foretold this order: Messiah cut off, then “the people of the prince that shall come
    shall destroy the city and the sanctuary.” Stated.'
  go: [254, 407]
- section: 455
  text: 'John writes as an eyewitness: "which we have seen with our eyes… and our hands have handled."'
  go: [413, 456]
- section: 456
  text: The last section. The second gap, everything after this, has no number because it is still being
    lived, and the reader is inside it.
  go: [373, 396, 429, 451]
- section: 456
  text: '"A great multitude… of all nations": the table of nations from Genesis 10, complete. The gates
    carry the names of Israel''s tribes and the foundations the names of the apostles.'
  go: [7, 11, 442]
- section: 456
  text: '"The tabernacle of God is with men," quoting Ezekiel 37:27. The book ends where John 1:1 began,
    the Word "with God," now with us.'
  go: [1, 245]
- section: 456
  text: '"A Lamb as it had been slain." The answer to Isaac''s question, at the throne.'
  go: [18, 297]
- section: 456
  text: 'Written here: "I John… was in the isle that is called Patmos" (1:9), commanded, "Write the things
    which thou hast seen." The last book, by the last living apostle in the text.'
  go: [413, 455]
- section: 456
  text: 'Revelation 12:4, the dragon waiting “to devour her child as soon as it was born,” gathers every
    attack on the seed into one picture: Pharaoh, Athaliah, Haman, Herod (my reading).'
  go: [36, 180, 269, 291]
- section: 456
  text: '"Come hither, I will shew thee the bride, the Lamb''s wife" (21:9). The Moriah thread and the
    bride thread meet here. The tree of life stands again "on either side of the river," and there is
    "no more curse" (22:2–3).'
  go: [2, 3, 18, 19]
