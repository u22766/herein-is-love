- part: 10
  title: The Silent Years
  note: 'About four hundred years, from Malachi to Luke. No book of this Bible describes them. They are
    not blank, though: Daniel 8 and 11 told them in advance, the Greek kingdom, its four-way split, and
    the sanctuary polluted (sections 252 and 258). And the feast of the dedication that Jesus attends
    in John 10:22 (section 371) comes from these years; it is not instituted anywhere in the text. Its
    origin is in the books of the Maccabees, outside the Protestant canon (outside the text).


    **Outside the canon:** 1 and 2 Maccabees (in the Catholic and Orthodox Old Testaments) record these
    years. Antiochus IV set up a pagan altar in the temple in 167 BC, the event Daniel 11:31 calls the
    "abomination that maketh desolate." The Maccabean revolt followed, and the temple was cleansed and
    rededicated (1 Maccabees 4:52–59), the origin of the feast in John 10:22. Hebrews 11:35 ("others were
    tortured, not accepting deliverance; that they might obtain a better resurrection") most likely recalls
    the mother and seven sons of 2 Maccabees 7. These books fill in the history. They add nothing to the
    promise line.'
